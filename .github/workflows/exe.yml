# Construye el .exe en un Windows limpio. Existe porque el fallo que costo dos
# commits en develop no estaba en el codigo: estaba en QUE Python habia instalado
# en la maquina del que construia. El de la Microsoft Store guarda Tcl/Tk dentro
# de un zip embebido, PyInstaller no puede copiarlo, y el .exe se construye sin
# un solo error para morir al arrancar. Aqui el interprete lo pone setup-python
# (CPython de python.org), asi que ese caso no puede volver a darse.
#
# El .exe NO se commitea: sale como artefacto de cada corrida y, en un tag, como
# adjunto de la Release. dist/ sigue en .gitignore a proposito.
name: exe

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Solo lo necesita el paso de Release; el resto va con lectura.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      # La misma comprobacion que hace construir_exe.bat. Aqui no deberia saltar
      # nunca; si salta, es que setup-python cambio de build y hay que enterarse.
      - name: Comprobar que Tcl/Tk no viene en un zipfs
        run: |
          python -c "import tkinter,sys;lib=tkinter.Tcl().eval('info library');print('Tcl en',lib);sys.exit(1 if lib.startswith('//zipfs') else 0)"

      - name: Pruebas
        run: python -m pytest -q

      - name: Empaquetar
        run: python -m PyInstaller hcauto.spec --noconfirm --clean

      # alias.json va JUNTO al .exe, no dentro de _internal\: el usuario lo amplia
      # a mano. Mismo criterio que construir_exe.bat.
      - name: Incluir alias.json
        run: copy /Y alias.json dist\ExtraccionSIC\alias.json
        shell: cmd

      # console=False: un import que falte no imprime nada. --autoprueba importa
      # todo, resuelve las carpetas y devuelve codigo de salida. Sin esto el
      # artefacto podria subirse roto.
      - name: Autoprueba del ejecutable
        run: |
          .\dist\ExtraccionSIC\ExtraccionSIC.exe --autoprueba
          type .\dist\ExtraccionSIC\autoprueba.txt
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: ExtraccionSIC
          path: dist/ExtraccionSIC/

      - name: Comprimir para la Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist\ExtraccionSIC\* -DestinationPath ExtraccionSIC.zip
      - name: Adjuntar a la Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ExtraccionSIC.zip
